{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "backend-api.fullname" . }}
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          # A single catch-all path: the REST API (/api/...) and the
          # Socket.IO gateway (/rt/..., same port) are served by the same
          # backend Service, so there's no reason to split routing rules
          # here.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "backend-api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
