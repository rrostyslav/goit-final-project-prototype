{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend-api.fullname" . }}
  labels:
    {{- include "backend-api.labels" . | nindent 4 }}
type: Opaque
# stringData, not data: Helm/Kubernetes base64-encodes stringData values
# for you, so nothing here needs to be pre-encoded — but the values
# themselves must still only ever arrive via --set/-f at deploy time (see
# values.yaml's secrets section). Every value defaults to "" in this
# chart's own values.yaml, so a bare `helm template`/`helm install` with
# no overrides renders a Secret with empty keys, not fabricated-looking
# credentials.
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_ACCESS_SECRET: {{ .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  LIVEKIT_API_KEY: {{ .Values.secrets.livekitApiKey | quote }}
  LIVEKIT_API_SECRET: {{ .Values.secrets.livekitApiSecret | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
{{- end }}
