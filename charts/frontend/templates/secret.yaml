{{- if and .Values.secrets.create .Values.secrets.extra -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend.fullname" . }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
type: Opaque
# The frontend has no runtime secrets today — see values.yaml's secrets
# comment. This only renders anything when secrets.extra is populated
# (forward-compatibility hook), so a default `helm template` produces no
# Secret object here at all rather than an empty placeholder one.
stringData:
  {{- toYaml .Values.secrets.extra | nindent 2 }}
{{- end }}
