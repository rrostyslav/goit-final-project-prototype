{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "livekit.fullname" . }}
  labels:
    {{- include "livekit.labels" . | nindent 4 }}
type: Opaque
# See values.yaml's `secrets` section: LIVEKIT_KEYS is LiveKit's own
# env-var form of the ConfigMap's `keys:` block, kept out of the
# ConfigMap specifically so no credential material is ever inlined there.
# Defaults to "" like every other secret value in this repo's charts —
# provide the real pair only via --set/-f at deploy time.
stringData:
  LIVEKIT_KEYS: {{ .Values.secrets.livekitKeys | quote }}
{{- end }}
